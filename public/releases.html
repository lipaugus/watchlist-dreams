<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fechas de Estreno</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Watchlist</a>
      <a href="lucas.html">Diario de Lucas</a>
      <a href="releases.html">Proximos Estrenos</a>
    </nav>
    <h1>Fechas de Estreno (Watchlist)</h1>
  </header>

  <div class="controls">
    <button id="loadReleasesBtn">Cargar Fechas de Estreno</button>

    <div style="margin-top: 10px;">
      <label><input type="checkbox" id="releasedTheaters"> Ya estrenadas en cines (AR)</label>
      <label><input type="checkbox" id="releasedDigital"> Ya estrenadas en digital</label>
      
      <label for="sortOrder">Ordenar por:</label>
      <select id="sortOrder">
        <option value="theater_asc">Fecha Cine (Mas antigua a reciente)</option>
        <option value="theater_desc">Fecha Cine (Mas reciente a antigua)</option>
        <option value="digital_asc">Fecha Digital (Mas antigua a reciente)</option>
        <option value="digital_desc">Fecha Digital (Mas reciente a antigua)</option>
      </select>
    </div>
  </div>

  <div id="statusMessage"></div>
  <div id="releasesList" class="movie-grid"></div>

  <script src="js/releases.js"></script>
</body>
</html>
