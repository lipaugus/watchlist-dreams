<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechas de Estreno</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Watchlist</a>
      <a href="lucas.html">Diario de Lucas</a>
      <a href="releases.html" class="active">Próximos Estrenos</a>
    </nav>
    <h1>Fechas de Estreno (Watchlist)</h1>
  </header>

  <div class="controls">
    <button id="loadReleasesBtn">Cargar Fechas de Estreno</button>

    <div class="filter-row">
      <label class="checkbox-label">
        <input type="checkbox" id="hasTheaterDate"> Tiene fecha en Cine
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="releasedTheaters"> Ya estrenada en Cine
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="hasDigitalDate"> Tiene fecha en Digital
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="releasedDigital"> Ya estrenada en Digital
      </label>
    </div>

    <div class="filter-row">
      <label for="sortOrder">Ordenar por:</label>
      <select id="sortOrder">
        <option value="theater_asc">Fecha Cine (Más antigua a reciente)</option>
        <option value="theater_desc">Fecha Cine (Más reciente a antigua)</option>
        <option value="digital_asc">Fecha Digital (Más antigua a reciente)</option>
        <option value="digital_desc">Fecha Digital (Más reciente a antigua)</option>
      </select>
    </div>
  </div>

  <div id="statusMessage"></div>
  <div id="releasesList" class="movie-grid"></div>

  <script src="js/releases.js"></script>
</body>
</html>
